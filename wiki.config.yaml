# wiki.config.yaml - per-repo configuration for the shared wiki generator
# (agent-ops issue #286). Read by agent-ops's scripts/wiki-generate.mjs via
# the thin caller at .github/workflows/wiki-generate.yml.
#
# Every path/glob below was verified against this repo's real tree before
# being written (not copied blind from agent-ops's
# templates/wiki-site/wiki.config.example.yaml) - see that file's own
# header comment for the general field reference.

site:
  title: "BusyBuddy Docs"
  description: "Public documentation and API reference for BusyBuddy."
  theme:
    accent: "#5169DD"
    accentHover: "#4257c4"
    accentMuted: "rgba(81, 105, 221, 0.1)"
  favicon: "/favicon.svg"
  githubUrl: "https://github.com/11thandOrange/BusyBuddy_v2"
  # Matches docs/CNAME's existing value - this domain is already live.
  customDomain: "busybuddy.dev"

# No wiki-backend instance is deployed yet (templates/wiki-backend), so the
# frontend's Sandbox ("Try it") panel has nothing to proxy through until
# one is stood up. Left as placeholders rather than guessed real values -
# the rest of the site (API reference, workflows, tests, automation status)
# doesn't depend on this.
backend:
  proxyBaseUrl: "https://busybuddy-wiki-backend.example.com"
  targetApiBaseUrl: "https://your-store.myshopify.com"

extractors:
  endpointsExpress:
    enabled: true
    routesGlob:
      - "web/backend/routes/**/index.js"
    mountFile: "web/backend/routes/index.js"
    controllerDir: "web/backend/controller"
    publicRouteFiles:
      - "web/backend/routes/frontStore/index.js"
    apiPrefix: "/api"

  endpointsKotlin:
    enabled: false

  workflows:
    enabled: true
    glob:
      - ".github/workflows/*.yml"
    exclude:
      - "openhands.yml.legacy"

  automation:
    enabled: true
    pipelinesYamlPath: "orchestrator/src/registry/pipelines.yaml"
    repoMatch: "11thandOrange/BusyBuddy_v2"

  tests:
    enabled: true
    suites:
      - name: "Storefront E2E"
        framework: playwright
        glob: "extensions/bogo-shopify-app/tests/e2e/**/*.spec.js"
      - name: "Backend unit/integration"
        framework: vitest
        glob: "web/backend/**/*.test.js"

  # docs/planning/*.md and ROADMAP.md (agent-ops's own template example)
  # don't exist in this repo - CHANGELOG.md does and is genuinely
  # public-facing content.
  markdown:
    enabled: true
    sources:
      - glob: "CHANGELOG.md"
        navSection: "Changelog"
      # Narrative architecture docs authored against this repo's real tree
      # (web/backend and web/frontend). Grounded in the actual code, not
      # derived - read verbatim by the markdown extractor.
      - glob: "docs/backend-architecture.md"
        navSection: "Backend"
      - glob: "docs/data-models.md"
        navSection: "Backend"
      - glob: "docs/services.md"
        navSection: "Backend"
      - glob: "docs/webhooks-and-jobs.md"
        navSection: "Backend"
      - glob: "docs/frontend-architecture.md"
        navSection: "Frontend"

  appList:
    enabled: true
    sourceFile: "web/frontend/pages/DashboardHome.jsx"
    widgetConfigExport: "widgetConfig"
    # planFeaturesExport dropped: DashboardHome.jsx exports only widgetConfig -
    # there is no `planFeatures` export in this file (the only `planFeatures`
    # in the repo is a local const inside web/backend/configs/subscriptionUtils.js,
    # not this source file). Pointing the extractor at a missing export made plan
    # tags silently empty; removing it is the lower-risk fix (vs. adding a
    # frontend export the app doesn't otherwise use). Per-app entitlement lives in
    # the Subscription model's appLimits (see docs/data-models.md).

  # Repo-local skills (SKILL.md with name/description/applies_to frontmatter).
  # These are the same files the dev-ticket pipeline reads from skills/ in this
  # repo's checkout; the extractor globs skills/**/SKILL.md and ingests the
  # frontmatter verbatim (never rewritten).
  skills:
    enabled: true
    roots:
      - "skills"

  # Package manifests present in this repo's tree. Enabled so the
  # Dependencies & Integrations page also lists real npm dependencies
  # (previously only the authored integrations below were shown).
  dependencies:
    enabled: true
    manifests:
      - "package.json"
      - "web/package.json"
      - "docs/package.json"
      - "extensions/bogo-shopify-app/package.json"

  # Third parties that live in no package.json - authored here (approach A)
  # and rendered on the Dependencies & Integrations page. Every field is a
  # literal from this config; nothing is derived or LLM-generated. Slugs are
  # referenced by feature docs' implements.integrations.
  integrations:
    enabled: true
    items:
      - slug: shopify-admin-api
        name: "Shopify Admin API"
        kind: api
        summary: "The Shopify platform the app is built on - discounts, products, subscriptions, and theme integration all go through the Admin API."
        auth: "OAuth session / admin API access token"
        url: "https://shopify.dev/docs/api/admin"
        notes:
          - kind: note
            body: "Session-authenticated backend routes under /api resolve the shop from the Shopify session."
      - slug: shopify-app-proxy
        name: "Shopify App Proxy"
        kind: api
        summary: "Serves BusyBuddy's public storefront endpoints (the frontStore router) so the theme can call the app without a merchant session."
        auth: "App-proxy signature (no merchant session)"
        url: "https://shopify.dev/docs/apps/build/online-store/display-dynamic-store-data"
        notes:
          - kind: tip
            body: "Only the frontStore routes are reachable this way; everything else requires an admin session."
      - slug: litellm-gateway
        name: "LiteLLM Gateway"
        kind: service
        summary: "The documentation-authoring alias the wiki generator's optional wiki-author step calls to draft feature prose. Not on the storefront request path."
        auth: "Virtual key (LITELLM_VIRTUAL_KEY)"
        url: "https://docs.litellm.ai/"
        notes:
          - kind: warning
            body: "author_content is currently off in the wiki-generate caller because this gateway was returning intermittent 500/503s; feature prose is committed directly instead."
      - slug: openhands-cloud
        name: "OpenHands Cloud"
        kind: service
        summary: "Autonomous-dev and complex-logic automations that pick up GitHub issues for this repo and open pull requests. Driven from the Postman collection."
        auth: "API key (OPENHANDS_API_KEY)"
        url: "https://app.all-hands.dev/"
        notes:
          - kind: note
            body: "See postman/README.md for the trigger -> poll -> send-issue-context workflow."
      - slug: pipeline-orchestrator
        name: "Pipeline Orchestrator (agent-ops)"
        kind: service
        summary: "The agent-ops control repo whose pipelines.yaml registers this repo's automation entries and whose shared workflow generates this docs site."
        auth: "GitHub App / repo secrets (secrets: inherit)"
        url: "https://github.com/11thandOrange/agent-ops"
        notes:
          - kind: note
            body: "The Automation page is generated from this repo's entries in agent-ops's orchestrator/src/registry/pipelines.yaml."

  # Authored (not derived) - drafted via wiki-author.mjs from
  # wiki-content/authoring.yaml when author_content: true is set on the
  # caller, then read verbatim from docs/src/content/features/*.md here.
  features:
    enabled: true

output:
  dataDir: "src/data"
  contentDir: "src/content"
