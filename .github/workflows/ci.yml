name: Install, Test & Build

on:
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            extensions/cart-transformer/package-lock.json
            extensions/bogo-shopify-app/package-lock.json
            docs/frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install web dependencies
        run: npm install
        working-directory: web

      - name: Install frontend dependencies
        run: npm install
        working-directory: web/frontend

      - name: Install cart-transformer dependencies
        run: npm ci
        working-directory: extensions/cart-transformer

      - name: Install bogo-shopify-app dependencies
        run: npm ci
        working-directory: extensions/bogo-shopify-app

      - name: Install docs dependencies
        run: npm ci
        working-directory: docs/frontend

      - name: Run backend tests
        run: npx vitest run
        working-directory: web/backend

      - name: Run frontend tests
        run: npm test
        working-directory: web/frontend

      - name: Run extension tests
        run: npm test
        working-directory: extensions/cart-transformer

      - name: Run bogo-shopify-app unit tests
        run: npm test
        working-directory: extensions/bogo-shopify-app

      - name: Build frontend
        run: npm run build
        working-directory: web/frontend
        env:
          CI: true

      - name: Build docs site
        run: npm run build
        working-directory: docs/frontend

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            web/coverage/
            web/frontend/coverage/
