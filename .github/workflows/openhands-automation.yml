name: OpenHands Automation Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      label_name:
        description: 'Label name'
        required: true
        type: string

jobs:
  trigger-openhands:
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger type
        id: check_trigger
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger_type=manual" >> $GITHUB_OUTPUT
            echo "issue_number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
            echo "label_name=${{ inputs.label_name }}" >> $GITHUB_OUTPUT
          else
            echo "trigger_type=automatic" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "label_name=${{ github.event.label.name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Validate trigger
        run: |
          echo "Trigger type: ${{ steps.check_trigger.outputs.trigger_type }}"
          echo "Issue: #${{ steps.check_trigger.outputs.issue_number }}"
          echo "Label: ${{ steps.check_trigger.outputs.label_name }}"
          if [[ "${{ steps.check_trigger.outputs.label_name }}" != "ready-to-implement" && "${{ steps.check_trigger.outputs.label_name }}" != "complex-logic" ]]; then
            echo "Skipping - label is not ready-to-implement or complex-logic"
            exit 78
          fi

      - name: Check API key
        id: check_api
        run: |
          if [ -z "${{ secrets.OPENHANDS_API_KEY }}" ]; then
            echo "warning=OPENHANDS_API_KEY secret is not configured. Please add it to repository settings." >> $GITHUB_OUTPUT
            echo "has_key=false" >> $GITHUB_OUTPUT
          else
            echo "warning=" >> $GITHUB_OUTPUT
            echo "has_key=true" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Note missing API key
        if: steps.check_api.outputs.has_key == 'false'
        run: |
          echo "::warning::${{ steps.check_api.outputs.warning }}"
          echo "Workflow cannot trigger OpenHands until OPENHANDS_API_KEY is configured."
          echo "Please add the OPENHANDS_API_KEY secret to repository Settings > Secrets and Actions."
          exit 78

      - name: Trigger OpenHands Cloud
        id: trigger
        uses: fjogeleit/http-request-action@master
        with:
          url: 'https://app.all-hands.dev/api/v1/app-conversations'
          method: 'POST'
          bearerToken: ${{ secrets.OPENHANDS_API_KEY }}
          contentType: 'application/json'
          data: >-
            {
              "initial_message": {
                "content": [
                  {
                    "type": "text",
                    "text": "Issue #${{ steps.check_trigger.outputs.issue_number }} has been labeled with '${{ steps.check_trigger.outputs.label_name }}'. Please analyze this issue and implement the required changes. Issue URL: https://github.com/${{ github.repository }}/issues/${{ steps.check_trigger.outputs.issue_number }}"
                  }
                ]
              },
              "selected_repository": "${{ github.repository }}"
            }
          responseHandle: 'body'
        continue-on-error: true

      - name: Check trigger result
        id: check_result
        run: |
          response=${{ steps.trigger.outputs.response }}
          echo "Response: $response"
          if echo "$response" | grep -q '"id"'; then
            echo "trigger_success=true" >> $GITHUB_OUTPUT
          else
            echo "trigger_success=false" >> $GITHUB_OUTPUT
          fi

      - name: Add comment on success
        if: steps.check_result.outputs.trigger_success == 'true'
        run: |
          gh issue comment "${{ steps.check_trigger.outputs.issue_number }}" --body "🤖 OpenHands has been triggered to work on this issue. Check progress here: https://app.all-hands.dev"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note trigger failure
        if: steps.check_result.outputs.trigger_success == 'false'
        run: |
          echo "::error::OpenHands API call failed - please check the OpenHands service status"
          echo "Issue #${{ steps.check_trigger.outputs.issue_number }} was not processed"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
