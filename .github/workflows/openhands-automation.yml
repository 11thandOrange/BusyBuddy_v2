name: OpenHands Automation Trigger

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number'
        required: true
        type: string
      label_name:
        description: 'Label name'
        required: true
        type: string

env:
  # Default to local backend; override via repository secret OPENHANDS_HOST for cloud
  OPENHANDS_HOST: ${{ secrets.OPENHANDS_HOST || 'http://localhost:18000' }}
  # Use provided API key, or empty string for local backend (no auth required)
  OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY || '' }}

jobs:
  trigger-openhands:
    runs-on: ubuntu-latest
    steps:
      - name: Check trigger type
        id: check_trigger
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "trigger_type=manual" >> $GITHUB_OUTPUT
            echo "issue_number=${{ inputs.issue_number }}" >> $GITHUB_OUTPUT
            echo "label_name=${{ inputs.label_name }}" >> $GITHUB_OUTPUT
          else
            echo "trigger_type=automatic" >> $GITHUB_OUTPUT
            echo "issue_number=${{ github.event.issue.number }}" >> $GITHUB_OUTPUT
            echo "label_name=${{ github.event.label.name }}" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Validate trigger
        run: |
          echo "Trigger type: ${{ steps.check_trigger.outputs.trigger_type }}"
          echo "Issue: #${{ steps.check_trigger.outputs.issue_number }}"
          echo "Label: ${{ steps.check_trigger.outputs.label_name }}"
          if [[ "${{ steps.check_trigger.outputs.label_name }}" != "ready-to-implement" && "${{ steps.check_trigger.outputs.label_name }}" != "complex-logic" ]]; then
            echo "Skipping - label is not ready-to-implement or complex-logic"
            exit 78
          fi

      - name: Trigger OpenHands (start tunnel and call API)
        id: trigger
        run: |
          # For local backend (default), start cloudflared tunnel
          # Check if OPENHANDS_HOST is empty or default localhost
          HOST_URL="${OPENHANDS_HOST:-http://localhost:18000}"
          echo "OPENHANDS_HOST env var: $OPENHANDS_HOST"
          echo "Using HOST_URL: $HOST_URL"
          
          if [[ -z "$OPENHANDS_HOST" || "$OPENHANDS_HOST" == "http://localhost:18000" ]]; then
            echo "Setting up cloudflared tunnel for local backend..."
            
            # Install cloudflared if not present
            if ! command -v cloudflared &> /dev/null; then
              echo "Installing cloudflared..."
              curl -fsSL https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /usr/local/bin/cloudflared
              chmod +x /usr/local/bin/cloudflared
            fi
            
            # Start tunnel in background
            TUNNEL_OUTPUT=$(mktemp)
            cloudflared tunnel --url http://localhost:18000 > "$TUNNEL_OUTPUT" 2>&1 &
            CF_PID=$!
            echo "cloudflared PID: $CF_PID"
            
            # Wait for tunnel URL
            echo "Waiting for tunnel URL..."
            TUNNEL_URL=""
            for i in {1..30}; do
              sleep 2
              TUNNEL_URL=$(grep -o 'https://[^ ]*trycloudflare.com' "$TUNNEL_OUTPUT" | head -1)
              if [[ -n "$TUNNEL_URL" ]]; then
                echo "Tunnel URL: $TUNNEL_URL"
                break
              fi
              echo "Attempt $i/30 - waiting for tunnel..."
            done
            
            if [[ -z "$TUNNEL_URL" ]]; then
              echo "::error::Failed to get tunnel URL"
              cat "$TUNNEL_OUTPUT"
              rm -f "$TUNNEL_OUTPUT"
              kill $CF_PID 2>/dev/null || true
              exit 1
            fi
            
            TARGET_URL="$TUNNEL_URL"
            rm -f "$TUNNEL_OUTPUT"
          else
            TARGET_URL="$OPENHANDS_HOST"
          fi
          
          echo "Target URL: $TARGET_URL"
          
          # Make the API call
          API_RESPONSE=$(curl -s -w "\n%{http_code}" --max-time 120 -X POST \
            "$TARGET_URL/api/v1/app-conversations" \
            -H "Content-Type: application/json" \
            ${OPENHANDS_API_KEY:+-H "Authorization: Bearer $OPENHANDS_API_KEY"} \
            -d '{
              "initial_message": {
                "content": [
                  {
                    "type": "text",
                    "text": "Issue #${{ steps.check_trigger.outputs.issue_number }} has been labeled with '\''${{ steps.check_trigger.outputs.label_name }}'\''. Please analyze this issue and implement the required changes. Issue URL: https://github.com/${{ github.repository }}/issues/${{ steps.check_trigger.outputs.issue_number }}"
                  }
                ]
              },
              "selected_repository": "${{ github.repository }}"
            }')
          
          # Extract body and status code
          HTTP_STATUS=$(echo "$API_RESPONSE" | tail -n1)
          RESPONSE_BODY=$(echo "$API_RESPONSE" | sed '$d')
          
          echo "http_status=$HTTP_STATUS"
          echo "response_body=$RESPONSE_BODY"
          
          if [[ "$HTTP_STATUS" == "200" || "$HTTP_STATUS" == "201" ]]; then
            echo "trigger_success=true" >> $GITHUB_OUTPUT
            echo "triggered_url=$TARGET_URL" >> $GITHUB_OUTPUT
          else
            echo "trigger_success=false" >> $GITHUB_OUTPUT
            echo "::error::OpenHands API call failed with status $HTTP_STATUS"
            echo "Response: $RESPONSE_BODY"
          fi

      - name: Add comment on success
        if: steps.trigger.outputs.trigger_success == 'true'
        run: |
          COMMENT_BODY="🤖 OpenHands (local) has been triggered to work on this issue. Check progress at ${{ steps.trigger.outputs.triggered_url }}"
          gh issue comment "${{ steps.check_trigger.outputs.issue_number }}" --body "$COMMENT_BODY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note trigger failure
        if: steps.trigger.outputs.trigger_success == 'false'
        run: |
          echo "Issue #${{ steps.check_trigger.outputs.issue_number }} was not processed"
