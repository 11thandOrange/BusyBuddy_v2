<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="BusyBuddy Documentation - Getting Started, Features, API Reference, and Architecture for the BusyBuddy Shopify app suite" />
    <title>BusyBuddy Docs</title>
  </head>
  <body>
    <script type="text/javascript">
      // Reverses the redirect in 404.html: turns "/?/api" back into a real
      // "/api" history entry before React Router mounts.
      (function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&');
            })
            .join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })(window.location);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
